# Workspaces (one tmux session per project folder) and Claude Code state
# markers. Appended after tmux.nix's extraConfig by tmux-agents.nix.
#
#   Alt+1…9, Alt+0   tab 1…10 (left Option is Alt in Ghostty)
#   Alt+g            lazygit in a floating window
#   Alt+s            floating scratch terminal for this workspace (Alt+s again hides it)
#   Alt+o            project picker (zoxide + fzf), opens the folder as a dev workspace
#   C-u s / C-u w    workspaces / tabs tree, with markers
#
# Markers (set by Claude Code hooks through `tmux-agent state`): a thick edge
# and coloured name on the tab and its workspace.
#   red = waiting on you   green = done (clears when you look at it)   grey edge = working
# Try it: ~/.config/tmux/bin/tmux-agent demo

set -g  detach-on-destroy off          # closing a workspace drops you into another one
set -g  set-titles on
set -g  set-titles-string '#S'         # workspace name as the Ghostty tab title
set -g  allow-passthrough on           # lets Claude Code's own notifications through

# tmux-agent rings the bell on waiting/done; markers do the colouring
setw -g monitor-bell on
set -g  bell-action other
set -g  visual-bell off
setw -g window-status-bell-style default

##### agent markers ###########################################################
# @agent is set per pane by `tmux-agent state`. Ignored once the pane is back at
# a shell prompt, so a crashed agent can't leave a stale marker.
set -g @agent-live '#{?#{m/r:^((ba|z|fi|da|k|tc)?sh|nu)$,#{pane_current_command}},,#{@agent}}'
set -g @agent-icon '#{?#{==:#{E:@agent-live},waiting},#[fg=#f7768e]●,#{?#{==:#{E:@agent-live},done},#[fg=#9ece6a]✓,#{?#{==:#{E:@agent-live},working},#[fg=colour250]●,}}}'
set-hook -g pane-focus-in 'if -F "#{==:#{@agent},done}" "set -p -u @agent"'

# Most urgent waiting/done colour (empty otherwise), for a workspace or a tab
set -g @ws-state  '#{?#{m:*waiting*,#{W:#{P:#{E:@agent-live} }}},#f7768e,#{?#{m:*done*,#{W:#{P:#{E:@agent-live} }}},#9ece6a,}}'
set -g @tab-state '#{?#{m:*waiting*,#{P:#{E:@agent-live} }},#f7768e,#{?#{m:*done*,#{P:#{E:@agent-live} }},#9ece6a,}}'
# Edge: thick ▌ in the state colour (grey while working), thin ▎ when idle.
# Same width either way, so nothing shifts when states change.
set -g @ws-edge  '#{?#{E:@ws-state},#[fg=#{E:@ws-state}]▌,#{?#{m:*working*,#{W:#{P:#{E:@agent-live} }}},#[fg=colour250]▌,#[fg=colour238]▎}}'
set -g @tab-edge '#{?#{E:@tab-state},#[fg=#{E:@tab-state}]▌,#{?#{m:*working*,#{P:#{E:@agent-live} }},#[fg=colour250]▌,#[fg=colour238]▎}}'

##### tab colours #############################################################
# Each tab position has its own accent (cycles after 5): the tab number in the
# status bar and the active pane's border. Red/green stay reserved for markers.
#   1 blue (nvim)   2 orange (claude)   3 purple (term)   4 cyan   5 yellow
# (matches on the last digit: #{e|%:...} arithmetic doesn't survive nesting in
# window-status-format, so every tab came out yellow)
set -g @tab-color '#{?#{m/r:[16]$,#{window_index}},#7aa2f7,#{?#{m/r:[27]$,#{window_index}},#ff9e64,#{?#{m/r:[38]$,#{window_index}},#bb9af7,#{?#{m/r:[49]$,#{window_index}},#7dcfff,#e0af68}}}}'
set -g pane-active-border-style 'fg=#{E:@tab-color}'
set -g pane-border-style 'fg=colour238'

##### panes ###################################################################
# Title bar on each pane (command + folder), only once a tab is split.
set -g  pane-border-status off
set -g  pane-border-format '#{?pane_active,#[fg=#{E:@tab-color}]#[bold],#[fg=colour244]} #{pane_current_command} #[nobold]#[fg=colour240]#{b:pane_current_path} '
set-hook -g window-layout-changed 'set -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
set-hook -g after-split-window    'set -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
# Unfocused panes a shade darker than Ghostty's background (#22272e)
set -g  window-style        'bg=#1c2128'
set -g  window-active-style 'bg=default'

##### theme ###################################################################
set -g message-style          'bg=#2d333b,fg=#adbac7'
set -g message-command-style  'bg=#2d333b,fg=#7aa2f7'
set -g mode-style             'bg=#7aa2f7,fg=#1c2128'   # copy-mode selection, tree cursor
set -g display-panes-colour        colour240
set -g display-panes-active-colour '#7aa2f7'
set -g clock-mode-colour      '#7aa2f7'
set -g popup-border-lines     rounded
set -g popup-border-style     'fg=#7aa2f7'
set -g popup-style            'bg=#22272e'

# Tab icon from the tab name (Nerd Font)
set -g @tab-icon '#{?#{m/r:^n?vim$,#{window_name}}, ,#{?#{m/r:^claude,#{window_name}},󰚩 ,#{?#{m/r:^(term|zsh|bash|sh|fish)$,#{window_name}}, ,#{?#{m/r:^(lazy)?git$,#{window_name}}, ,}}}}'

##### status bar ##############################################################
# Left: workspaces in the order opened, current one bold. Then the tabs.
# Sessions starting with _ (scratch popups) are hidden.
set -g @ws     '#{?#{m:_*,#{session_name}},,#{E:@ws-edge}#[fg=#{?#{E:@ws-state},#{E:@ws-state},colour244}]#{session_name} }'
set -g @ws-cur '#{?#{m:_*,#{session_name}},,#{E:@ws-edge}#[fg=#{?#{E:@ws-state},#{E:@ws-state},colour255}]#[bold]#{session_name}#[nobold] }'
set -g status-left '#{S/i:#{E:@ws},#{E:@ws-cur}}#[fg=colour238]│ '
set -g status-left-length 80

setw -g window-status-format         '#{E:@tab-edge}#[fg=#{E:@tab-color}]#I#[fg=colour237]:#[fg=#{?#{E:@tab-state},#{E:@tab-state},colour250}]#{E:@tab-icon}#W#[fg=colour244]#F '
setw -g window-status-current-format '#{E:@tab-edge}#[fg=#{E:@tab-color}]#[bold]#I:#[nobold]#[fg=#{?#{E:@tab-state},#{E:@tab-state},colour255}]#{E:@tab-icon}#[bold]#W#[nobold]#[fg=colour50]#F '

##### keys ####################################################################
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-0 select-window -t :=10

# floating windows (M-p / M-t are left alone: Claude Code uses them)
bind -n M-g display-popup -E -w 90% -h 90% -T ' lazygit ' -d '#{pane_current_path}' lazygit
bind -n M-s if -F '#{m:_scratch-*,#{session_name}}' 'detach-client' "display-popup -E -w 85% -h 80% -T ' scratch ' -d '#{pane_current_path}' '$HOME/.config/tmux/bin/tmux-agent scratch #{session_name}'"
bind -n M-o display-popup -E -w 60% -h 50% -T ' projects ' '$HOME/.config/tmux/bin/tmux-agent pick'

# trees with a marker next to each workspace / tab / pane
set -g @tree-fmt '#{?pane_format,#{E:@agent-icon}#[default] ,#{?window_format,#{P:#{E:@agent-icon}}#[default] ,#{W:#{P:#{E:@agent-icon}}}#[default] }}#{E:tree_mode_format}'
bind w choose-tree -Zw -F '#{E:@tree-fmt}' -f '#{?#{m:_*,#{session_name}},0,1}'
bind s choose-tree -Zs -F '#{E:@tree-fmt}' -f '#{?#{m:_*,#{session_name}},0,1}'

# Workspaces (one tmux session per project folder) and Claude Code state
# markers. Appended after tmux.nix's extraConfig by tmux-agents.nix.
#
#   Alt+1…9, Alt+0   tab 1…10 (left Option is Alt in Ghostty)
#   C-u s / C-u w    workspaces / tabs tree, with markers
#
# Markers (set by Claude Code hooks through `tmux-agent state`): a thick edge
# and coloured name on the tab and its workspace.
#   red = waiting on you   green = done (clears when you look at it)   grey edge = working
# Try it: ~/.config/tmux/bin/tmux-agent demo

set -g  detach-on-destroy off          # closing a workspace drops you into another one
set -g  set-titles on
set -g  set-titles-string '#S'         # workspace name as the Ghostty tab title
set -g  allow-passthrough on           # lets Claude Code's own notifications through

# tmux-agent rings the bell on waiting/done; markers do the colouring
setw -g monitor-bell on
set -g  bell-action other
set -g  visual-bell off
setw -g window-status-bell-style default

##### agent markers ###########################################################
# @agent is set per pane by `tmux-agent state`. Ignored once the pane is back at
# a shell prompt, so a crashed agent can't leave a stale marker.
set -g @agent-live '#{?#{m/r:^((ba|z|fi|da|k|tc)?sh|nu)$,#{pane_current_command}},,#{@agent}}'
set -g @agent-icon '#{?#{==:#{E:@agent-live},waiting},#[fg=#f7768e]●,#{?#{==:#{E:@agent-live},done},#[fg=#9ece6a]✓,#{?#{==:#{E:@agent-live},working},#[fg=colour250]●,}}}'
set-hook -g pane-focus-in 'if -F "#{==:#{@agent},done}" "set -p -u @agent"'

# Most urgent waiting/done colour (empty otherwise), for a workspace or a tab
set -g @ws-state  '#{?#{m:*waiting*,#{W:#{P:#{E:@agent-live} }}},#f7768e,#{?#{m:*done*,#{W:#{P:#{E:@agent-live} }}},#9ece6a,}}'
set -g @tab-state '#{?#{m:*waiting*,#{P:#{E:@agent-live} }},#f7768e,#{?#{m:*done*,#{P:#{E:@agent-live} }},#9ece6a,}}'
# Edge: thick ▌ in the state colour (grey while working), thin ▎ when idle.
# Same width either way, so nothing shifts when states change.
set -g @ws-edge  '#{?#{E:@ws-state},#[fg=#{E:@ws-state}]▌,#{?#{m:*working*,#{W:#{P:#{E:@agent-live} }}},#[fg=colour250]▌,#[fg=colour238]▎}}'
set -g @tab-edge '#{?#{E:@tab-state},#[fg=#{E:@tab-state}]▌,#{?#{m:*working*,#{P:#{E:@agent-live} }},#[fg=colour250]▌,#[fg=colour238]▎}}'

##### status bar ##############################################################
# Left: workspaces in the order opened, current one bold. Then the tabs.
set -g @ws     '#{E:@ws-edge}#[fg=#{?#{E:@ws-state},#{E:@ws-state},colour244}]#{session_name} '
set -g @ws-cur '#{E:@ws-edge}#[fg=#{?#{E:@ws-state},#{E:@ws-state},colour255}]#[bold]#{session_name}#[nobold] '
set -g status-left '#{S/i:#{E:@ws},#{E:@ws-cur}}#[fg=colour238]│ '
set -g status-left-length 80

setw -g window-status-format         '#{E:@tab-edge}#[fg=colour244]#I#[fg=colour237]:#[fg=#{?#{E:@tab-state},#{E:@tab-state},colour250}]#W#[fg=colour244]#F '
setw -g window-status-current-format '#{E:@tab-edge}#[fg=colour250]#I:#[fg=#{?#{E:@tab-state},#{E:@tab-state},colour255}]#[bold]#W#[nobold]#[fg=colour50]#F '

##### keys ####################################################################
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-0 select-window -t :=10

# trees with a marker next to each workspace / tab / pane
set -g @tree-fmt '#{?pane_format,#{E:@agent-icon}#[default] ,#{?window_format,#{P:#{E:@agent-icon}}#[default] ,#{W:#{P:#{E:@agent-icon}}}#[default] }}#{E:tree_mode_format}'
bind w choose-tree -Zw -F '#{E:@tree-fmt}'
bind s choose-tree -Zs -F '#{E:@tree-fmt}'
